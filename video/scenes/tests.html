<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="theme.css" />
    <style>
      .tbl {
        margin-top: 26px;
        border: 1px solid var(--border);
        border-radius: 20px;
        background: var(--surface);
        overflow: hidden;
      }
      .thead,
      .trow {
        display: grid;
        grid-template-columns: 1fr 190px 190px 190px;
        align-items: center;
        padding: 0 28px;
      }
      .thead {
        height: 54px;
        border-bottom: 1px solid var(--border-active);
        font: 500 22px var(--mono);
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--sand-400);
      }
      .thead span:not(:first-child) {
        text-align: center;
      }
      .trow {
        height: 51px;
        border-bottom: 1px solid var(--border);
        font-size: 27px;
        color: var(--sand-100);
      }
      .trow:last-child {
        border-bottom: 0;
      }
      .cell {
        text-align: center;
      }
      .trow .name {
        padding-right: 20px;
      }
    </style>
  </head>
  <body>
