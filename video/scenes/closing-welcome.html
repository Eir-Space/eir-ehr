<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="theme.css" />
  </head>
  <body>
    <div class="orb"></div>
    <div
      class="stage"
      style="
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding-top: 120px;
      "
    >
      <div class="tile sm" data-at="0.15" data-anim="scale">
        <img src="../assets/rune.png" alt="" />
      </div>
      <h1
        class="grad"
        data-line="0"
        data-t="welcome.title"
        style="margin-top: 34px; font-size: 96px"
      ></h1>
      <div data-line="0" data-delay="0.8" style="margin-top: 34px">
        <span class="btn"
          ><i data-icon="git-pull-request"></i><span>github.com/Eir-Space/eir-ehr</span></span
        >
      </div>
      <p
        class="muted"
        data-line="0"
        data-delay="1.4"
        style="margin-top: 26px; font-size: 30px; font-family: var(--mono)"
        data-t="welcome.sub"
      ></p>
    </div>
    <script src="icons.js"></script>
    <script src="runtime.js"></script>
  </body>
</html>
