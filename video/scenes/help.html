<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="theme.css" />
  </head>
  <body>
    <div class="stage">
      <div class="kicker" data-at="0.2" data-t="help.kicker"></div>
      <h2 data-line="0" data-t="help.title" style="margin-bottom: 30px"></h2>
      <div class="grid" style="grid-template-columns: 1fr 1fr">
        <div
          class="card teal"
          data-line="1"
          data-anim="up"
          style="display: flex; gap: 24px; padding: 34px 36px; min-height: 210px"
        >
          <div class="badge"><i data-icon="globe"></i></div>
          <div>
            <h3 data-t="help.a"></h3>
            <p class="muted" style="font-size: 30px; margin-top: 8px" data-t="help.a2"></p>
          </div>
        </div>
        <div
          class="card teal"
          data-line="2"
          data-anim="up"
          style="display: flex; gap: 24px; padding: 34px 36px; min-height: 210px"
        >
          <div class="badge"><i data-icon="book-open"></i></div>
          <div>
            <h3 data-t="help.b"></h3>
            <p class="muted" style="font-size: 30px; margin-top: 8px" data-t="help.b2"></p>
          </div>
        </div>
        <div
          class="card teal"
          data-line="3"
          data-anim="up"
          style="display: flex; gap: 24px; padding: 34px 36px; min-height: 210px"
        >
          <div class="badge"><i data-icon="key-round"></i></div>
          <div>
            <h3 data-t="help.c"></h3>
            <p class="muted" style="font-size: 30px; margin-top: 8px" data-t="help.c2"></p>
          </div>
        </div>
        <div
          class="card teal"
          data-line="4"
          data-anim="up"
          style="display: flex; gap: 24px; padding: 34px 36px; min-height: 210px"
        >
          <div class="badge"><i data-icon="eye"></i></div>
          <div>
            <h3 data-t="help.d"></h3>
            <p class="muted" style="font-size: 30px; margin-top: 8px" data-t="help.d2"></p>
          </div>
        </div>
      </div>
    </div>
    <script src="icons.js"></script>
    <script src="runtime.js"></script>
  </body>
</html>
