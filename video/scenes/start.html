<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="theme.css" />
  </head>
  <body>
    <div class="stage">
      <div class="kicker" data-at="0.2" data-t="start.kicker"></div>
      <h2 data-at="0.3" data-t="start.title" style="margin-bottom: 34px"></h2>
      <div class="terminal" data-at="0.6" data-anim="up">
        <div class="bar"><i></i><i></i><i></i></div>
        <div data-line="0" data-anim="fade" data-dur="0.1">
          <span class="prompt">$ </span
          ><span data-line="0" data-delay="0.2" data-anim="type" data-dur="2.4"
            >git clone https://github.com/Eir-Space/eir-ehr</span
          >
        </div>
        <div data-line="0" data-delay="3.2" data-anim="fade" data-dur="0.1">
          <span class="prompt">$ </span
          ><span data-line="0" data-delay="3.4" data-anim="type" data-dur="1.3"
            >cd eir-ehr &amp;&amp; npm ci</span
          >
        </div>
        <div data-line="0" data-delay="5.3" data-anim="fade" data-dur="0.1">
          <span class="prompt">$ </span
          ><span data-line="0" data-delay="5.5" data-anim="type" data-dur="1.6"
            >npm run terminology:import</span
          >
        </div>
        <div data-line="1" data-anim="fade" data-dur="0.1">
          <span class="prompt">$ </span
          ><span data-line="1" data-delay="0.2" data-anim="type" data-dur="1.4"
            >EIR_DEMO=1 npm start</span
          >
        </div>
        <div data-line="1" data-delay="2.2" data-anim="fade" class="c">
          Eir EHR: http://127.0.0.1:4180
        </div>
      </div>
      <div style="margin-top: 34px" data-line="1" data-delay="2.6" data-stagger="0.2">
        <span class="chip ok"><i data-icon="check"></i><span data-t="start.p1"></span></span
        ><span class="chip ok"><i data-icon="check"></i><span data-t="start.p2"></span></span
        ><span class="chip ok"><i data-icon="check"></i><span data-t="start.p3"></span></span>
      </div>
    </div>
    <script src="icons.js"></script>
    <script src="runtime.js"></script>
  </body>
</html>
