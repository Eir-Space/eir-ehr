<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="theme.css" />
  </head>
  <body>
    <div class="stage">
      <div class="kicker" data-at="0.2" data-t="contribute.kicker"></div>
      <h2 data-line="0" data-t="contribute.title"></h2>
      <div data-line="0" data-delay="0.5" data-stagger="0.12" style="margin-top: 28px">
        <span class="chip"><i data-icon="stethoscope"></i><span data-t="contribute.r1"></span></span
        ><span class="chip"
          ><i data-icon="heart-pulse"></i><span data-t="contribute.r2"></span></span
        ><span class="chip"><i data-icon="code"></i><span data-t="contribute.r3"></span></span
        ><span class="chip"><i data-icon="eye"></i><span data-t="contribute.r4"></span></span
        ><span class="chip"><i data-icon="user-check"></i><span data-t="contribute.r5"></span></span
        ><span class="chip"
          ><i data-icon="shield-check"></i><span data-t="contribute.r6"></span></span
        ><span class="chip"><i data-icon="languages"></i><span data-t="contribute.r7"></span></span>
      </div>
      <div class="row" style="margin-top: 64px; gap: 30px">
        <div class="card teal col" data-line="1" data-anim="up" style="flex: 1.25; gap: 12px">
          <div class="row" style="gap: 20px; align-items: center">
            <div class="badge"><i data-icon="code"></i></div>
            <h3 data-t="contribute.code"></h3>
          </div>
          <p class="mono teal" style="font-size: 42px">github.com/Eir-Space/eir-ehr</p>
          <p class="muted small" data-t="contribute.code2"></p>
        </div>
        <div class="card ai col" data-line="2" data-anim="up" style="flex: 1; gap: 12px">
          <div class="row" style="gap: 20px; align-items: center">
            <div class="badge gold"><i data-icon="sparkles"></i></div>
            <h3 data-t="contribute.demo"></h3>
          </div>
          <p class="mono gold" style="font-size: 42px">ehr.eir.space</p>
          <p class="muted small" data-t="contribute.demo2"></p>
        </div>
      </div>
    </div>
    <script src="icons.js"></script>
    <script src="runtime.js"></script>
  </body>
</html>
