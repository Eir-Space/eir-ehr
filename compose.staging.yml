name: eir-ehr-synthetic-staging
services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: eir_staging
      POSTGRES_PASSWORD: ${EIR_STAGING_ADMIN_PASSWORD:?Set a unique staging database administrator password}
    ports:
      - '127.0.0.1:55433:5432'
    volumes:
      - staging-postgres:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d eir_staging']
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
volumes:
  staging-postgres:
